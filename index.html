<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>El Padre Burgers</title><link rel="stylesheet" href="style.css"></head><body>
<aside><div class="logo">🍔</div><h1>El Padre<br>Burgers</h1>
<button data-p="menu" class="on">Menu</button><button data-p="comments">Comments</button><button data-p="delivery">Delivery</button></aside>
<main id="m"><p class="empty">Chargement…</p></main>
<script src="config.js"></script><script>
let D={menu:[],comments:[],agencies:[]},page="menu",cat=CATS[0];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const m=document.getElementById("m");
document.querySelectorAll("aside button").forEach(b=>b.onclick=()=>{page=b.dataset.p;document.querySelectorAll("aside button").forEach(x=>x.classList.toggle("on",x==b));draw()});
function draw(){
 if(page=="menu"){
  const items=D.menu.filter(i=>i.category==cat);
  m.innerHTML=`<h2>Menu</h2><div class="cats">${CATS.map(c=>`<button class="cat ${c==cat?"on":""}" data-c="${c}">${c}</button>`).join("")}</div>
  <div class="grid">${items.map(i=>`<div class="card">${i.image?`<img src="${esc(i.image)}" alt="">`:""}<h3>${esc(i.name)}</h3><span class="price">${esc(i.price)} DA</span></div>`).join("")||'<p class="empty">Aucun produit.</p>'}</div>`;
  m.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{cat=b.dataset.c;draw()});
 }else if(page=="comments"){
  m.innerHTML=`<h2>Comments</h2><select id="w">${WILAYAS.map(w=>`<option>${w}</option>`).join("")}</select>
  <textarea id="t" rows="3" maxlength="300" placeholder="Comment :"></textarea><button class="send" id="s">Envoyer</button>
  ${D.comments.slice().reverse().map(c=>`<div class="bub"><small>👤 ${esc(c.wilaya)}</small><br>${esc(c.text)}</div>`).join("")}`;
  document.getElementById("s").onclick=async()=>{const t=document.getElementById("t").value.trim();if(!t)return;
   await api.post({action:"comment",wilaya:document.getElementById("w").value,text:t});D=await api.get();draw()};
 }else{
  m.innerHTML=`<h2>Delivery · ${D.agencies.length} agences</h2><div class="grid">${D.agencies.map(a=>`<div class="card">${a.image?`<img src="${esc(a.image)}" alt="">`:""}<h3>${esc(a.wilaya)}</h3>
  <a href="tel:${esc(a.phone)}">📞 ${esc(a.phone)}</a>${a.location?`<a href="${esc(a.location)}" target="_blank" rel="noopener">📍 Location</a>`:""}</div>`).join("")}</div>`;
 }}
api.get().then(d=>{D=d;draw()}).catch(()=>m.innerHTML="<p>Erreur de connexion à la base de données.</p>");
</script></body></html>
